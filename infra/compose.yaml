name: stakeholder-dashboard

services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: stakeholder_dashboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d stakeholder_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ../backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://dashboard:dashboard@database:5432/stakeholder_dashboard
      REQUIRE_DATABASE: "true"
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "false"
      API_CORS_ORIGINS: http://localhost:8080
      UPLOAD_ROOT: /app/uploads
      DOCUMENT_STORAGE_DURABLE: "true"
      AUTH_MODE: development
      DEVELOPMENT_ROLES: Account Admin
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads

  web:
    build:
      context: ../frontend
    ports:
      - "8080:8080"
    depends_on:
      - api
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  api_uploads:
