name: infrastructure-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CloudFormation linter
        run: python -m pip install cfn-lint
      - name: Validate CloudFormation syntax
        run: cfn-lint aws/*.yaml
