name: backend-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
          POSTGRES_DB: dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard -d dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://dashboard:dashboard@127.0.0.1:5432/dashboard_test
      REQUIRE_DATABASE: "true"
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "false"
      DEVELOPMENT_ROLES: Account Admin
      UPLOAD_ROOT: ${{ github.workspace }}/.ci-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m app.manage seed-demo
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python -m alembic check
      - run: python -m pip check
      - run: docker build --tag stakeholder-api:ci .

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt pip-audit
      - run: pip-audit -r requirements.txt
      - run: python -m compileall -q app tests
