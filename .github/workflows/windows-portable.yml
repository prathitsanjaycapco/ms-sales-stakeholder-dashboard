name: windows-portable

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-portable-package

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-portable.txt
      - shell: pwsh
        run: ./packaging/build-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: StakeholderDashboard-windows-x64
          path: artifacts/StakeholderDashboard-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
